[project]
name = "tutor-contrib-delete-course"
description = "Open edX plugin for admin-only course deletion in Studio"
authors = [{ name = "Abstract Technology GmbH" }]
maintainers = [{ name = "Abstract Technology GmbH" }]
license = { text = "AGPL-3.0-only" }
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
  "tutor>=21.0.0,<22.0.0",
  "tutor-mfe>=21.0.0,<22.0.0",
]

[tool.hatch.version]
path = "tutor/delete_course_plugin_tutor/__about__.py"

[tool.hatch.build]
exclude = [
  "/frontend/node_modules",
  "/frontend/build",
  "/frontend/dist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutor/delete_course_plugin_tutor"]
only-include = ["tutor/delete_course_plugin_tutor"]

[tool.hatch.build.targets.wheel.force-include]
"backend/" = "delete-course-plugin-backend"
"frontend/" = "delete-course-plugin-frontend"

[tool.hatch.build.targets.sdist]
strict-naming = false
include = ["tutor/delete_course_plugin_tutor", "/backend", "/frontend"]

[project.entry-points."tutor.plugin.v1"]
delete-course = "delete_course_plugin_tutor.plugin"
